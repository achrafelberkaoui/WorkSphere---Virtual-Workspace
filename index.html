<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSphere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDE BAR -->
    <aside>
        <h1 class="title_bar">Staff Members (Unassigned)</h1>
        <div class="worker" id="workerId"></div>
        <button class="addWorker" id="add_Worker">Add New Worker</button>
    </aside>

    <!-- MAIN AREA -->
    <main class="container">
        <!-- Modal Postes -->
        <section class="postes" id="addPostes">
            <h2>W3C</h2>
            <div class="poste1" id="poste1"  data-max="5">
                <div class="workerPlaces">
                    <p>Réception</p>
                    <!-- <div class="PosteWorker">
                            <img class="icon" src="img/iconParDefault.jpg" alt="">
                            <div>
                                <p>achraf</p>
                                <p>Role</p>
                            </div>
                        <button class="deleList">X</button>

                        </div> -->

                </div>

                <button class="assignBtn" data-role="receptionist" data-role2="manager" data-role3="cleaning"
                    data-target="poste1">+</button>
            </div>

            <div class="poste2" id="poste2" data-max="5">
                <div class="workerPlaces">
                    <p>Salle des serveurs</p>
                </div>
                <button class="assignBtn" data-role="it" data-role2="manager" data-role3="cleaning"
                    data-target="poste2">+</button>
            </div>
            <div class="poste3" id="poste3" data-max="5">
                <div class="workerPlaces">
                    <p>Salle de sécurité</p>
                </div>
                <button class="assignBtn" data-role="security" data-role2="manager" data-role3="cleaning"
                    data-target="poste3">+</button>
            </div>
            <div class="poste4" id="poste4" data-max="5">
                <div class="workerPlaces">
                    <p>Salle de conférence</p>
                </div>
                <button class="assignBtn" data-role="manager" data-role3="cleaning" data-target="poste4">+</button>
            </div>
            <div class="poste5" id="poste5" data-max="5">
                <div class="workerPlaces">
                    <p>Salle du personnel</p>
                </div>
                <button class="assignBtn" data-role="cleaning" data-role2="manager" data-role3="cleaning"
                    data-target="poste5">+</button>
            </div>
            <div class="poste6" id="poste6" data-max="5">
                <div class="workerPlaces">
                    <p>Salle d'archives</p>
                </div>
                <button class="assignBtn" data-role="other" data-role2="manager" data-target="poste6">+</button>
            </div>
        </section>

        <!-- FORM SECTION -->
        <section class="containerForm" id="work-form">
                        <h2>W3C</h2>
            <form class="form">

                <!-- NAME -->
                <div class="form__group">
                    <label class="form__label" for="work-name">Name :</label>
                    <input type="text" id="work-name" class="input" placeholder="Enter worker name" required>
                </div>

                <!-- ROLE -->
                <div class="form__group">
                    <label class="form__label" for="Role">Role :</label>
                    <select id="Role" class="input" required>
                        <option value="">-- Select Role --</option>
                        <option value="manager">Manager</option>
                        <option value="receptionist">Receptionniste</option>
                        <option value="it">Technicien IT</option>
                        <option value="security">Agent de sécurité</option>
                        <option value="cleaning">Nettoyage</option>
                        <option value="other">Autre</option>
                    </select>
                </div>

                <!-- IMAGE URL -->
                <div class="form__group">
                    <label class="form__label" for="worker-image">Image URL</label>
                    <input type="url" id="worker-image" class="input" placeholder="https://example.com/image.jpg">
                </div>

                <!-- PHOTO PREVIEW -->
                <div class="form__group">
                    <img id="preview" src="img/iconParDefault.jpg" alt="Photo">
                </div>

                <!-- EXPERIENCE -->
                <div class="form__group" id="experience-container">
                    <label class="form__label">Experiences :</label>
                    <div class="experience-row" id="experience-row">
                        <label for="Company">Company :</label>
                        <input type="text" id="Company" class="experience-title input" placeholder="Title / Company"
                            required>
                        <label for="expRole">Role :</label>
                        <input type="text" id="expRole" class="experience-role input" placeholder="Reseption" required>
                        <label for="From">From :</label>
                        <input type="date" id="From" class="experience-start" required>
                        <label for="to">To :</label>
                        <input type="date" id="to" class="experience-end" required>
                    </div>
                    <button type="button" id="add-experience">Add Another Experience</button>
                </div>

                <!-- TELEPHONE -->
                <div class="form__group">
                    <label class="form__label" for="tele">Téléphone</label>
                    <input type="text" id="tele" class="input" placeholder="+212 600000000" required>
                </div>

                <!-- EMAIL -->
                <div class="form__group">
                    <label class="form__label" for="email">Email</label>
                    <input type="email" id="email" class="input" placeholder="example@example.com" required>
                </div>
                <!-- BUTTONS -->
                <div class="form__actions">
                    <button type="submit" id="creat" class="btnSubbmit">Add Worker</button>
                    <button type="button" class="cancel" id="cancel">Cancel</button>
                </div>

            </form>
        </section>
        <!-- Modal Details -->
        <section id="modaldetails" class="modaldetails">
            <div id="content"></div>
            <button id="close" class="close">X</button>
            <img id="modalPhoto" src="img/iconParDefault.jpg" alt="Photo"
                style="width:80px; height:80px; border-radius:50%;">
            <h3 id="modalName">nom</h3>
            <p id="modalRole"></p>
            <p id="modalEmail"></p>
            <p id="modalTel"></p>
            <div id="modalExperience">
            </div>
        </section>

        <!-- assignModal  -->
        <section id="assignModal" class="assignModal">
            <div class="assignBox">
                <span id="closeAssign" class="closeAssign">X</span>
                <h3>Choisir Worker</h3>
                <div id="assignList"></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
