<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkSphere</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <aside>
        <h1 class="title_bar">Staff Members (Unssigned)</h1>
        <div class="worker" id="workerId"></div>
        <button class="addWorker" id="add_Worker"> Add New Worker </button>
    </aside>

    <main class="containare">    
    <section class="containareForm" id="work-form" >
    <form class="form">

            <!-- Name -->
            <div class="form__group">
                <label class="form__label" for="work-name">Name :</label>
                <input type="text" id="work-name" class="input" placeholder="Enter worker name" required>
            </div>

            <!-- Role -->
            <div class="form__group">
                <label class="form__label" for="Role">Role :</label>
                <input type="text" id="Role" class="input" placeholder="IT ..."></input>
            </div>
            <!-- Image URL -->
            <div class="form__group">
                <label class="form__label" for="worker-image">Image URL</label>
                <input type="url" id="worker-image" class="input" placeholder="https://example.com/image.jpg">
            </div>

            <!-- Photo Preview  -->
            <div class="form-group">
                <span class="icon"></span>
                <img src="img/iconParDefault.jpg" alt="Photo">
            </div>

            <!-- Company
            <div class="form__group">
                <label class="form__label" for="Company">Company</label>
                <input type="text" id="Company" class="input" placeholder="youcode" required>
            </div>
            -->

            <!-- tele -->
            <div class="form__group">
                <label class="form__label" for="tele">Téléphone</label>
                <input type="number" id="tele" class="input" placeholder="+212 600000000" min="1" required>
            </div>

            <!-- Email -->
            <div class="form__group">
                <label class="form__label" for="email">Email</label>
                <input type="email" id="email" class="input" placeholder="example@example.com" required>
            </div>

            <!-- Experiences -->
            <fieldset class="Experiences">
                <legend class="Experience">Experiences
                    <button type="button" class="btnExperience" id="btn-add-experience">+ Add Experience</button>
                </legend>

                <div id="experiences-list" class="experiences__list">

                </div>
            </fieldset>

            <!-- Submit Button -->
            <div class="form__actions">
                <button type="submit" id="creat" class="btnSubbmit">Add Worker</button>
                <button type="button" id="cancel">Cancel</button>
            </div>
        </form>
    </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
